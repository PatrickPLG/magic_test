# The Studiz rubocop rules generated specs must satisfy (Appendix D).
AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  SuggestExtensions: false
  DisabledByDefault: true

Style/MethodCallWithArgsParentheses:
  Enabled: true
  IgnoreMacros: true
  AllowedMethods:
    - require
    - require_relative
    - describe
    - it
    - context
    - puts
    - raise
  IgnoredMethods: []

Layout/LineLength:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Lint/Syntax:
  Enabled: true

Layout/IndentationConsistency:
  Enabled: true

Layout/IndentationWidth:
  Enabled: true

Layout/TrailingWhitespace:
  Enabled: true

Layout/EmptyLines:
  Enabled: true

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes
