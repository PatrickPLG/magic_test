<script>

  // Arrow function to get XPath to element
  const getPathTo = (element) => {
    if (element.tagName === 'HTML') {
      return '/HTML[1]';
    }
    if (element === document.body) {
      return '/HTML[1]/BODY[1]';
    }
    let ix = 0;
    const siblings = element.parentNode.childNodes;
    for (let i = 0; i < siblings.length; i++) {
      const sibling = siblings[i];
      if (sibling === element) {
        return getPathTo(element.parentNode) + '/' + element.tagName + '[' + (ix + 1) + ']';
      }
      if (sibling.nodeType === 1 && sibling.tagName === element.tagName) {
        ix++;
      }
    }
  };

  // Arrow function to check visibility
  const visibleFilter = (target) => {
    const computedStyle = window.getComputedStyle(target);
    return !(computedStyle.display === 'none' || computedStyle.visibility === 'hidden' || target.hidden);
  };

  // Main finder function using arrow syntax
  const finderForElement = (element) => {
    // Try to find just using the element tagName
    const tagName = element.tagName.toLowerCase();
    if (document.querySelectorAll(tagName).length === 1) {
      return `find('${tagName}')`;
    }
    // Try adding in the classes of the element
    const classList = Array.from(element.classList);
    const classString = classList.length ? "." + classList.join('.') : "";
    if (classList.length && document.querySelectorAll(tagName + classString).length === 1) {
      return `find('${tagName}${classString}')`;
    }
    // Try adding in the text of the element
    const text = element.textContent.trim();
    const targets = Array.from(document.querySelectorAll(`${tagName}${classString}`))
                       .filter(visibleFilter)
                       .filter((el) => el.textContent.includes(text));
    if (text && targets.length === 1) {
      return `find('${tagName}${classString}', text: '${text}')`;
    }
    // use the xpath to the element
    return `find(:xpath, '${getPathTo(element)}')`;
  };


</script>
