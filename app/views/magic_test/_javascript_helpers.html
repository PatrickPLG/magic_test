<script text="text/javascript">

  // --- START: New Selector Logic ---
  const BOOTSTRAP_CLASS_REGEX = /^(m|p|d-|g-|col|align|justify|text|bg|border|flex|order|fs-|fw-|lh-|w-|h-|position-|top-|bottom-|start-|end-|translate-|rounded|shadow|overflow-|float-|object-|opacity-|visibility-|z-)/;
  const MAX_ANCESTOR_SEARCH_DEPTH = 5; // Limit how far up we look for a scope

  function isUnique(selector) {
    if (!selector) return false;
    try {
      return document.querySelectorAll(selector).length === 1;
    } catch (e) {
      // Handle invalid selectors potentially generated during class combinations
      // console.warn("MagicTest: Invalid selector generated during check:", selector, e);
      return false;
    }
  }

  function escapeCSSIdentifier(ident) {
    // Basic escaping for CSS identifiers (more comprehensive escaping might be needed)
    // See: https://developer.mozilla.org/en-US/docs/Web/API/CSS/escape
    if (window.CSS && CSS.escape) {
      return CSS.escape(ident);
    } else {
      // Basic fallback for older browsers or environments without CSS.escape
      return ident.replace(/[^a-zA-Z0-9_-]/g, '\\$&');
    }
  }

  // Tries to find the most robust and semantic CSS selector for a given element
  // Returns an object: { type: 'global'| 'scoped' | 'none', selector?, ancestorSelector?, targetSelector? }
  function findBestSelector(element) {
    if (!element) return { type: 'none' };

    // --- Try finding a GLOBALLY unique selector first ---
    function findGlobalSelector(el) {
      // 1. ID
      if (el.id) {
        const idSelector = `#${escapeCSSIdentifier(el.id)}`;
        if (isUnique(idSelector)) return idSelector;
      }

      // 2. Name (for form elements)
      const tagName = el.tagName.toUpperCase();
      if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(tagName) && el.name) {
        const nameSelector = `${tagName.toLowerCase()}[name="${el.name}"]`;
        if (isUnique(nameSelector)) return nameSelector;
      }

      // 3. & 4. Label/Button Text (Handled directly in event handlers for now)

      // 5. Semantic Classes (filtering utility classes)
      if (el.classList && el.classList.length > 0) {
        const semanticClasses = Array.from(el.classList).filter(cls => !BOOTSTRAP_CLASS_REGEX.test(cls));
        if (semanticClasses.length > 0) {
          const classSelector = '.' + semanticClasses.map(escapeCSSIdentifier).join('.');
          if (isUnique(classSelector)) return classSelector;
        }
      }

      // 6. Robust CSS Fallback (Tag + Type/Href etc.)
      let fallbackSelector = tagName.toLowerCase();
      if (tagName === 'INPUT' && el.type) {
        fallbackSelector += `[type="${el.type}"]`;
      } // Add other attributes if needed
      if (isUnique(fallbackSelector)) return fallbackSelector;

      // 7. Last Resort: Tag + Single Semantic Class
      if (el.classList && el.classList.length > 0) {
         const semanticClasses = Array.from(el.classList).filter(cls => !BOOTSTRAP_CLASS_REGEX.test(cls));
         for (const cls of semanticClasses) {
           const singleClassSelector = `${tagName.toLowerCase()}.${escapeCSSIdentifier(cls)}`;
           if (isUnique(singleClassSelector)) return singleClassSelector;
         }
      }
      return null; // No globally unique selector found for this element
    }

    let globalSelector = findGlobalSelector(element);
    if (globalSelector) {
      return { type: 'global', selector: globalSelector };
    }

    // --- If no global selector, try finding a SCOPED context ---
    let currentElement = element;
    for (let depth = 0; depth < MAX_ANCESTOR_SEARCH_DEPTH; depth++) {
      let ancestorElement = currentElement.parentElement;
      if (!ancestorElement || ancestorElement.tagName === 'BODY' || ancestorElement.tagName === 'HTML') {
        break; // Stop if we reach the top or run out of parents
      }

      let ancestorSelector = findGlobalSelector(ancestorElement); // Can the ancestor be uniquely identified?
      if (ancestorSelector) {
        // Found a unique ancestor. Now try to find the original target *relative* to it.
        // Use simple selectors for the relative target (e.g., classes, tag+attribute)
        const tagName = element.tagName.toUpperCase();
        let relativeSelector = null;

        // --- START: Refactored Relative Selector Search ---
        function findRelativeSelector(targetEl, ancestorEl) {
          const targetTagName = targetEl.tagName.toLowerCase();

          // 1. Try all semantic classes (if unique within scope)
          if (targetEl.classList && targetEl.classList.length > 0) {
            const semanticClasses = Array.from(targetEl.classList).filter(cls => !BOOTSTRAP_CLASS_REGEX.test(cls));
            if (semanticClasses.length > 0) {
              const candidateSelector = '.' + semanticClasses.map(escapeCSSIdentifier).join('.');
              try {
                const matches = ancestorEl.querySelectorAll(candidateSelector);
                if (matches.length === 1 && matches[0] === targetEl) return candidateSelector;
              } catch(e) { /* ignore */ }
            }
          }

          // 2. Try specific attributes like name, title (if unique within scope)
          const uniqueAttrs = ['name', 'title', 'aria-label']; // Add others if needed
          for (const attr of uniqueAttrs) {
             if (targetEl.hasAttribute(attr)) {
                 const attrValue = targetEl.getAttribute(attr);
                 const candidateSelector = `${targetTagName}[${attr}="${attrValue}"]`;
                 try {
                     const matches = ancestorEl.querySelectorAll(candidateSelector);
                     if (matches.length === 1 && matches[0] === targetEl) return candidateSelector;
                 } catch(e) { /* ignore */ }
             }
          }

          // 3. Try Tag + Single Semantic Class :not(.otherSemanticClass) - Handles ticket button case
          //    Checks if combining a class the element *has* with one it *lacks* (but a sibling might have) creates uniqueness.
          if (targetEl.classList && targetEl.classList.length > 0) {
            const semanticClasses = Array.from(targetEl.classList).filter(cls => !BOOTSTRAP_CLASS_REGEX.test(cls));
            const siblings = Array.from(ancestorEl.children).filter(child => child.tagName === targetEl.tagName && child !== targetEl);

            for (const targetCls of semanticClasses) {
              // Find classes that siblings have but the target doesn't
              let missingClasses = [];
              siblings.forEach(sibling => {
                 if(sibling.classList.contains(targetCls)) { // Only compare siblings with the same primary class
                    Array.from(sibling.classList).forEach(siblingCls => {
                        if (!BOOTSTRAP_CLASS_REGEX.test(siblingCls) && !targetEl.classList.contains(siblingCls)) {
                           if (!missingClasses.includes(siblingCls)) missingClasses.push(siblingCls);
                        }
                    });
                 }
              });

              // Try selector like .targetClass:not(.missingClass1):not(.missingClass2)
              if (missingClasses.length > 0) {
                const notSelectors = missingClasses.map(cls => `:not(.${escapeCSSIdentifier(cls)})`).join('');
                const candidateSelector = `.${escapeCSSIdentifier(targetCls)}${notSelectors}`;
                 try {
                     const matches = ancestorEl.querySelectorAll(candidateSelector);
                     // Correction: Need to check targetTagName as well
                     const fullCandidateSelector = `${targetTagName}${candidateSelector}`;
                     const fullMatches = ancestorEl.querySelectorAll(fullCandidateSelector);

                     if (fullMatches.length === 1 && fullMatches[0] === targetEl) return fullCandidateSelector;
                 } catch(e) { /* ignore */ }
              }
               // Also try the simple class on its own if not tried above or if it failed
               const simpleClassSelector = `${targetTagName}.${escapeCSSIdentifier(targetCls)}`;
               try {
                 const simpleMatches = ancestorEl.querySelectorAll(simpleClassSelector);
                 if (simpleMatches.length === 1 && simpleMatches[0] === targetEl) return simpleClassSelector;
               } catch(e) { /* ignore */ }
            }
          }

          // 4. Positional Fallback: :nth-of-type
          //    Calculate the index among siblings of the same tag name
          let index = -1;
          const siblingsOfType = Array.from(ancestorEl.children).filter(child => child.tagName === targetEl.tagName);
          for(let i = 0; i < siblingsOfType.length; i++) {
              if (siblingsOfType[i] === targetEl) {
                  index = i + 1; // CSS :nth-of-type is 1-based
                  break;
              }
          }
          if (index > 0) {
              const candidateSelector = `${targetTagName}:nth-of-type(${index})`;
              try {
                  // Verify this selector actually selects the target element within the ancestor
                  const match = ancestorEl.querySelector(candidateSelector);
                  if (match === targetEl) {
                      // Double check uniqueness just in case querySelector picked the first of multiple matches somehow (unlikely but safe)
                       const matches = ancestorEl.querySelectorAll(candidateSelector);
                       if (matches.length === 1) return candidateSelector;
                  }
              } catch(e) { /* ignore */ }
          }

          return null; // No unique relative selector found
        }

        relativeSelector = findRelativeSelector(element, ancestorElement);
        // --- END: Refactored Relative Selector Search ---

        // If we found a unique relative selector for the target within this unique ancestor
        if (relativeSelector) {
          return {
            type: 'scoped',
            ancestorSelector: ancestorSelector,
            targetSelector: relativeSelector
          };
        }
      }
      // If ancestor wasn't unique, or target wasn't unique within it, move up
      currentElement = ancestorElement;
    }

    // If loop finishes without finding a scoped context
    return { type: 'none' };
  }
  // --- END: New Selector Logic ---

  ready(function() {
    console.log("🪄 Magic Test activated in the browser!")
    initializeStorage();
    initializeMutationObserver();
  });

  // Helper to get the original select ID from a chosen container element
  function getOriginalSelectId(chosenElement) {
    const container = chosenElement.closest('div.chosen-container');
    if (container && container.id && container.id.endsWith('_chosen')) {
      return container.id.substring(0, container.id.length - '_chosen'.length);
    }
    return null;
  }

  function clickFunction(event) {
    var element = event.target;
    var tagName = element.tagName;
    var action = "";
    var target = "";
    var options = "";

    // --- Chosen.js Handling --- START
    const chosenContainer = element.closest('div.chosen-container');
    if (chosenContainer) {
      const originalSelectId = getOriginalSelectId(chosenContainer);
      if (!originalSelectId) return; // Could not map back, ignore

      // Case 1: Click to open the dropdown (on the container or the single selection link)
      if (element.matches('a.chosen-single, div.chosen-container') || element.closest('a.chosen-single')) {
        action = "magic_choose_open";
        target = originalSelectId; // Use original select ID
        options = "";
      }
      // Case 2: Click to select an option from the results list
      else if (element.matches('ul.chosen-results li')) {
        action = "magic_choose_select";
        target = originalSelectId; // Use original select ID
        options = element.textContent || element.innerText; // Get the selected option's text
        // Handle potential deselection in multi-select (may need refinement)
      } else if (element.matches('ul.chosen-choices li.search-choice a.search-choice-close')) {
        // TODO: Add handling for deselecting in multi-select if needed
        // action = "magic_choose_deselect";
        // target = originalSelectId;
        // options = element.parentElement.querySelector('span').textContent;
        console.log("MagicTest: Chosen multi-select deselect detected but not yet handled.");
        return; // For now, don't record deselection
      } else {
        return; // Click inside chosen, but not on a recognized interactive element
      }

      // Record the custom chosen action
      var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
      testingOutput.push({action: action, target: target, options: options });
      sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
      return; // Prevent default click handling below
    }
    // --- Chosen.js Handling --- END

    // Default handling for non-chosen elements
    let recordedData = null; // Object to hold the data to record

    // Priority 1: Buttons, Links, Submit Inputs (prefer text-based finders)
    if (tagName == "BUTTON" || tagName == "A" || (tagName == "INPUT" && element.type == 'submit')) {
      let targetText = element.textContent || element.innerText || element.value;
      if (!targetText || targetText.trim().length === 0) {
        targetText = element.getAttribute('aria-label') || element.getAttribute('title');
      }

      if (targetText && targetText.trim().length > 0) {
        // Found usable text/label -> Use click_on 'Target'
        recordedData = {
          action: "click_on",
          target: "\'" + targetText.trim().replace(/\'/g, "\\\'") + "\'", // Escape for Ruby
          options: ""
        };
      } else {
        // If no text/label found, fall back to selector find
        let selectorResult = findBestSelector(element);
        if (selectorResult.type === 'global') {
            recordedData = {
                action: "find",
                target: `'${selectorResult.selector.replace(/\'/g, "\\\'")}'`, // Escaped selector in quotes
                options: ".click"
            };
        } else if (selectorResult.type === 'scoped') {
            recordedData = {
                scopeType: 'within',
                scopeSelector: `'${selectorResult.ancestorSelector.replace(/\'/g, "\\\'")}'`, // Escaped ancestor selector
                action: "find",
                target: `'${selectorResult.targetSelector.replace(/\'/g, "\\\'")}'`, // Escaped relative target selector
                options: ".click"
            };
        } else {
            console.warn("MagicTest: Could not find suitable text or selector for button/link:", element);
            // recordedData remains null
        }
      }
    }
    // Priority 2: Other Input Types (Clicks on checkbox, radio etc.)
    else if (tagName == "INPUT") {
      let ignoreType = ['text', 'password', 'date', 'email', 'month', 'number', 'search', 'tel', 'url', 'week', 'time', 'datetime-local', 'color', 'range', 'file'];
      if (ignoreType.includes(element.type)) {
        return; // Ignore clicks that just focus text-like inputs
      }
      // For other input types, use findBestSelector
      let selectorResult = findBestSelector(element);
      if (selectorResult.type === 'global') {
          recordedData = {
              action: "find",
              target: `'${selectorResult.selector.replace(/\'/g, "\\\'")}'`, // Escaped selector in quotes
              options: ".click"
          };
      } else if (selectorResult.type === 'scoped') {
          recordedData = {
              scopeType: 'within',
              scopeSelector: `'${selectorResult.ancestorSelector.replace(/\'/g, "\\\'")}'`, // Escaped ancestor selector
              action: "find",
              target: `'${selectorResult.targetSelector.replace(/\'/g, "\\\'")}'`, // Escaped relative target selector
              options: ".click"
          };
      } else {
         console.warn("MagicTest: Could not find suitable selector for input:", element);
         // recordedData remains null
      }
    }
    // Priority 3: General Fallback for other clickable elements (divs, spans, svgs etc.)
    else {
      let selectorResult = findBestSelector(element);
      if (selectorResult.type === 'global') {
          recordedData = {
              action: "find",
              target: `'${selectorResult.selector.replace(/\'/g, "\\\'")}'`, // Escaped selector in quotes
              options: ".click"
          };
      } else if (selectorResult.type === 'scoped') {
          recordedData = {
              scopeType: 'within',
              scopeSelector: `'${selectorResult.ancestorSelector.replace(/\'/g, "\\\'")}'`, // Escaped ancestor selector
              action: "find",
              target: `'${selectorResult.targetSelector.replace(/\'/g, "\\\'")}'`, // Escaped relative target selector
              options: ".click"
          };
      } else {
         console.warn("MagicTest: Could not find suitable selector for generic element:", element);
         // recordedData remains null
      }
    }

    // Record the determined action if found
    if (recordedData) {
        var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
        testingOutput.push(recordedData);
        sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
    }
  };

  function keypressFunction(evt) {
    evt = evt || window.event;
    var element = evt.target;

    // --- Chosen.js Handling --- START
    if (element.matches('input.chosen-search-input')) {
      const originalSelectId = getOriginalSelectId(element);
      if (!originalSelectId) return; // Cannot map back

      var charCode = evt.keyCode || evt.which;
      var charStr = String.fromCharCode(charCode);
      var searchText = (element.value + charStr).trim().replace("'", "\\\'"); // Append char and trim

      var action = "magic_choose_search";
      var target = originalSelectId;
      var options = searchText;

      var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
      var lastAction = testingOutput[testingOutput.length - 1];

      // If the last action was also a search on the same chosen input, update it
      if (lastAction && lastAction.action == action && lastAction.target == target) {
        lastAction.options = options;
      } else {
        testingOutput.push({action: action, target: target, options: options});
      }
      sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
      return; // Prevent default keypress handling
    }
    // --- Chosen.js Handling --- END

    // Default handling for standard inputs
    var charCode = evt.keyCode || evt.which;
    var charStr = String.fromCharCode(charCode);
    if (!evt.target.labels || evt.target.labels.length === 0) { // Check if labels exist
      // Handle inputs without labels (e.g., use placeholder or name as fallback?)
      // For now, just return to avoid errors.
      // console.log("MagicTest: Keypress on element without labels, ignored.", evt.target);
      return;
    }
    var label = evt.target.labels[0].textContent;
    var text = (evt.target.value + charStr).trim().replace("'", "\\\'");
    var action = "fill_in";
    // Use label text or fall back to input name/id if label is empty
    var targetIdentifier = label || evt.target.name || evt.target.id;
    if (!targetIdentifier) return; // Cannot identify the input field

    var target = "\'" + targetIdentifier.trim().replace("'", "\\\'") + "\'";
    var options = ", with: '" + text + "'";
    var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
    var lastAction = testingOutput[testingOutput.length - 1];
    if (lastAction && lastAction.action == action && lastAction.target == target) {
      lastAction.options = options;
    } else {
      testingOutput.push({action: action, target: target, options: options});
    }
    sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
  }

  function keyDownFunction(evt){
    if (evt.target.labels) {
      return;
    }
    evt = evt || window.event;
    var charCode = evt.keyCode || evt.which;
    var charStr = capybaraFromCharCode(charCode);
    var letter = evt.key == "'" ? "\\\'" : evt.key;
    var tagName = evt.target.tagName.toLowerCase();

    // Use findBestSelector to identify the target element
    let selectorResult = findBestSelector(evt.target);
    let recordedData = null;

    // Format the key: symbol (e.g., :enter) or escaped string ('a', '\\\'')
    var targetKey = letter.startsWith(':') ? letter : `'\'${letter.replace(/\'/g, "\\\'")}\'`;
    var sendKeysOptions = `.send_keys(${targetKey})`;

    if (selectorResult.type === 'global') {
        recordedData = {
            action: 'find',
            target: `'${selectorResult.selector.replace(/\'/g, "\\\'")}'`, // Escaped selector
            options: sendKeysOptions
        };
    } else if (selectorResult.type === 'scoped') {
        recordedData = {
            scopeType: 'within',
            scopeSelector: `'${selectorResult.ancestorSelector.replace(/\'/g, "\\\'")}'`, // Escaped ancestor selector
            action: 'find',
            target: `'${selectorResult.targetSelector.replace(/\'/g, "\\\'")}'`, // Escaped relative target selector
            options: sendKeysOptions
        };
    } else {
        // Fallback if findBestSelector fails (maybe log? or try simple tag?)
        console.warn("MagicTest: Could not find suitable selector for keydown target:", evt.target);
        // Could potentially record based on tag name as a last resort, but might be fragile:
        // recordedData = { action: 'find', target: `'${evt.target.tagName.toLowerCase()}'`, options: sendKeysOptions };
        // For now, ignore if no good selector found
    }


    if (recordedData) {
        var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
        var lastAction = testingOutput[testingOutput.length - 1];

        // --- START: Aggregation Logic Refinement (Needs careful check) ---
        // Check if last action can be aggregated. Criteria:
        // 1. Current action is character key (not symbol like :enter)
        // 2. Last action exists
        // 3. Last action was also a send_keys (options start with .send_keys)
        // 4. Scope matches (both global or both within same ancestorSelector)
        // 5. Target element matches (same target selector)

        let canAggregate = false;
        if (!letter.startsWith(':') && lastAction && lastAction.options && lastAction.options.startsWith('.send_keys')) {
            const sameScope = (lastAction.scopeType || 'global') === (recordedData.scopeType || 'global') &&
                              lastAction.scopeSelector === recordedData.scopeSelector;
            const sameTarget = lastAction.action === recordedData.action && // both 'find'
                               lastAction.target === recordedData.target;

            if (sameScope && sameTarget) {
                canAggregate = true;
            }
        }

        if (canAggregate) {
             // Extract existing keys and append the new key
             let existingKeys = lastAction.options.substring('.send_keys('.length, lastAction.options.length - 1);
             lastAction.options = `.send_keys(${existingKeys}, ${targetKey})`;
             // Update the sessionStorage directly
             sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
        } else {
          // Cannot aggregate, push new action
          testingOutput.push(recordedData);
          sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
        }
        // --- END: Aggregation Logic Refinement ---
    }
  }

  function keyUpFunction(evt){
    if (evt.target.labels) {
      return;
    }

    evt = evt || window.event;
    var charCode = evt.keyCode || evt.which;
    var charStr = capybaraKeyUpFromCharCode(charCode);
    if (!charStr) {
      return;
    }
    var letter = String.fromCharCode(charCode);
    var tagName = evt.target.tagName.toLowerCase();
    var action = `find('${tagName}').`;
    var target = ""
    if (charStr) {
      target = `send_keys(${charStr})`;
    } else {
      target = `send_keys('${letter}')`;
    }
    var options = "";
    var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
    var lastAction = testingOutput[testingOutput.length - 1];
    if (lastAction && lastAction.action == action && lastAction.target.substr(0,9) == 'send_keys') {
      if (charStr) {
        lastAction.target = lastAction.target.substr(0, lastAction.target.length - 1) + ', ' + charStr + '' + ')'
      } else {
        lastAction.target = lastAction.target.substr(0, lastAction.target.length - 1) + ', \'' + letter + '\'' + ')'
      }
    } else {
      testingOutput.push({action: action, target: target, options: options});
    }
    sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
  }

</script>
