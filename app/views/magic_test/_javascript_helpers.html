<script text="text/javascript">

  // --- START: New Selector Logic ---
  const BOOTSTRAP_CLASS_REGEX = /^(m|p|d-|g-|col|align|justify|text|bg|border|flex|order|fs-|fw-|lh-|w-|h-|position-|top-|bottom-|start-|end-|translate-|rounded|shadow|overflow-|float-|object-|opacity-|visibility-|z-)/;

  function isUnique(selector) {
    if (!selector) return false;
    try {
      return document.querySelectorAll(selector).length === 1;
    } catch (e) {
      // Handle invalid selectors potentially generated during class combinations
      // console.warn("MagicTest: Invalid selector generated during check:", selector, e);
      return false;
    }
  }

  function escapeCSSIdentifier(ident) {
    // Basic escaping for CSS identifiers (more comprehensive escaping might be needed)
    // See: https://developer.mozilla.org/en-US/docs/Web/API/CSS/escape
    if (window.CSS && CSS.escape) {
      return CSS.escape(ident);
    } else {
      // Basic fallback for older browsers or environments without CSS.escape
      return ident.replace(/[^a-zA-Z0-9_-]/g, '\\$&');
    }
  }

  function findBestSelector(element) {
    if (!element) return null;

    // 1. ID
    if (element.id) {
      const idSelector = `#${escapeCSSIdentifier(element.id)}`;
      if (isUnique(idSelector)) return idSelector;
    }

    // 2. Name (for form elements)
    const tagName = element.tagName.toUpperCase();
    if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(tagName) && element.name) {
      const nameSelector = `${tagName.toLowerCase()}[name="${element.name}"]`;
      if (isUnique(nameSelector)) return nameSelector;
    }

    // 3. Associated Label Text (for form elements)
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tagName) && element.id) {
      const label = document.querySelector(`label[for="${escapeCSSIdentifier(element.id)}"]`);
      if (label && label.textContent.trim()) {
        // This requires Capybara's fill_in/select/etc. logic, return null here
        // Let the specific handlers in click/keypress functions use the label text directly
      }
    }

    // 4. Button/Link/Submit Text (Handled directly in clickFunction for now)
    // Can be added here if needed for other contexts

    // 5. Semantic Classes (filtering utility classes)
    if (element.classList && element.classList.length > 0) {
      const semanticClasses = Array.from(element.classList).filter(cls => !BOOTSTRAP_CLASS_REGEX.test(cls));
      if (semanticClasses.length > 0) {
        const classSelector = '.' + semanticClasses.map(escapeCSSIdentifier).join('.');
        if (isUnique(classSelector)) return classSelector;

        // Optional: Try combinations if the full set isn't unique (adds complexity)
      }
    }

    // 6. Robust CSS Fallback (Tag + Type/Href for some elements)
    let fallbackSelector = tagName.toLowerCase();
    if (tagName === 'INPUT' && element.type) {
      fallbackSelector += `[type="${element.type}"]`;
    } else if (tagName === 'A' && element.href) {
      // Href can be too long/complex, maybe avoid generally?
      // fallbackSelector += `[href="${element.getAttribute('href')}"]`; // Use getAttribute for literal value
    }
    // Add other specific attributes if needed

    if (isUnique(fallbackSelector)) return fallbackSelector;

    // --- Last Resort ---
    // Maybe try tag + a single filtered class?
    if (element.classList && element.classList.length > 0) {
       const semanticClasses = Array.from(element.classList).filter(cls => !BOOTSTRAP_CLASS_REGEX.test(cls));
       for (const cls of semanticClasses) {
         const singleClassSelector = `${tagName.toLowerCase()}.${escapeCSSIdentifier(cls)}`;
         if (isUnique(singleClassSelector)) return singleClassSelector;
       }
    }

    // If still no unique selector, return null - indicating we couldn't find a good one.
    return null;
  }
  // --- END: New Selector Logic ---

  ready(function() {
    console.log("🪄 Magic Test activated in the browser!")
    initializeStorage();
    initializeMutationObserver();
  });

  // Helper to get the original select ID from a chosen container element
  function getOriginalSelectId(chosenElement) {
    const container = chosenElement.closest('div.chosen-container');
    if (container && container.id && container.id.endsWith('_chosen')) {
      return container.id.substring(0, container.id.length - '_chosen'.length);
    }
    return null;
  }

  function clickFunction(event) {
    var element = event.target;
    var tagName = element.tagName;
    var action = "";
    var target = "";
    var options = "";

    // --- Chosen.js Handling --- START
    const chosenContainer = element.closest('div.chosen-container');
    if (chosenContainer) {
      const originalSelectId = getOriginalSelectId(chosenContainer);
      if (!originalSelectId) return; // Could not map back, ignore

      // Case 1: Click to open the dropdown (on the container or the single selection link)
      if (element.matches('a.chosen-single, div.chosen-container') || element.closest('a.chosen-single')) {
        action = "magic_choose_open";
        target = originalSelectId; // Use original select ID
        options = "";
      }
      // Case 2: Click to select an option from the results list
      else if (element.matches('ul.chosen-results li')) {
        action = "magic_choose_select";
        target = originalSelectId; // Use original select ID
        options = element.textContent || element.innerText; // Get the selected option's text
        // Handle potential deselection in multi-select (may need refinement)
      } else if (element.matches('ul.chosen-choices li.search-choice a.search-choice-close')) {
        // TODO: Add handling for deselecting in multi-select if needed
        // action = "magic_choose_deselect";
        // target = originalSelectId;
        // options = element.parentElement.querySelector('span').textContent;
        console.log("MagicTest: Chosen multi-select deselect detected but not yet handled.");
        return; // For now, don't record deselection
      } else {
        return; // Click inside chosen, but not on a recognized interactive element
      }

      // Record the custom chosen action
      var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
      testingOutput.push({action: action, target: target, options: options });
      sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
      return; // Prevent default click handling below
    }
    // --- Chosen.js Handling --- END

    // Default handling for non-chosen elements
    if (tagName == "BUTTON" || tagName == "A" || (tagName == "INPUT" && element.type == 'submit')) {
      action = "click_on";
      // Prefer text content, value, aria-label, or title for click_on
      target = element.textContent || element.innerText || element.value; // Order matters
      if (!target || target.trim().length === 0) {
        target = element.getAttribute('aria-label') || element.getAttribute('title');
      }

      if (target && target.trim().length > 0) {
        // Found usable text/label -> Use click_on 'Target'
        target = "\'" + target.trim().replace(/\'/g, "\\'") + "\'"; // Escape for Ruby
        options = ""; // No options needed for click_on
      } else {
        // If no text/label found, fall back to CSS selector find
        var selector = findBestSelector(element);
        if (selector) {
          var escapedSelector = selector.replace(/\'/g, "\\'"); // Escape for Ruby string
          // --- START FIX: Correct recording format ---
          // action = `find('${escapedSelector}')`;
          // target = `.click`; // Append .click on the Ruby side
          // options = "";
          action = "find";
          target = `'\''${escapedSelector}'\'`; // Embed selector in single quotes
          options = ".click";
          // --- END FIX ---
        } else {
          console.warn("MagicTest: Could not find suitable text or selector for button/link:", element);
          return; // Cannot reliably identify, ignore click
        }
      }
    }
    // Priority 2: Other Input Types (Clicks on checkbox, radio etc.)
    else if (tagName == "INPUT") {
      // Ignore clicks that just focus text-like inputs (handled by keypress/fill_in)
      let ignoreType = ['text', 'password', 'date', 'email', 'month', 'number', 'search', 'tel', 'url', 'week', 'time', 'datetime-local', 'color', 'range', 'file']; // Expanded ignore list
      if (ignoreType.includes(element.type)) {
        return;
      }
      // For other input types (checkbox, radio, etc.), use findBestSelector
      var selector = findBestSelector(element);
      if (selector) {
        var escapedSelector = selector.replace(/\'/g, "\\'"); // Escape for Ruby string
        // --- START FIX: Correct recording format ---
        // action = `find('${escapedSelector}')`;
        // target = `.click`; // Append .click on the Ruby side
        // options = "";
        action = "find";
        target = `'\''${escapedSelector}'\'`; // Embed selector in single quotes
        options = ".click";
        // --- END FIX ---
      } else {
         console.warn("MagicTest: Could not find suitable selector for input:", element);
         return; // Cannot determine a reliable way to record this click
      }
    }
    // Priority 3: General Fallback for other clickable elements (divs, spans, svgs etc.)
    else {
      var selector = findBestSelector(element);
      if (selector) {
        var escapedSelector = selector.replace(/\'/g, "\\'"); // Escape for Ruby string
        // --- START FIX: Correct recording format ---
        // action = `find('${escapedSelector}')`;
        // target = `.click`; // Append .click on the Ruby side
        // options = "";
        action = "find";
        target = `'\''${escapedSelector}'\'`; // Embed selector in single quotes
        options = ".click";
        // --- END FIX ---
      } else {
         // If even findBestSelector fails, log it and ignore the click
         console.warn("MagicTest: Could not find suitable selector for generic element:", element);
         return; // Cannot determine a reliable way to record this click
      }
    }

    // Record the determined action
    var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
    testingOutput.push({action: action, target: target, options: options });
    sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
  };

  function keypressFunction(evt) {
    evt = evt || window.event;
    var element = evt.target;

    // --- Chosen.js Handling --- START
    if (element.matches('input.chosen-search-input')) {
      const originalSelectId = getOriginalSelectId(element);
      if (!originalSelectId) return; // Cannot map back

      var charCode = evt.keyCode || evt.which;
      var charStr = String.fromCharCode(charCode);
      var searchText = (element.value + charStr).trim().replace("'", "\\\'"); // Append char and trim

      var action = "magic_choose_search";
      var target = originalSelectId;
      var options = searchText;

      var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
      var lastAction = testingOutput[testingOutput.length - 1];

      // If the last action was also a search on the same chosen input, update it
      if (lastAction && lastAction.action == action && lastAction.target == target) {
        lastAction.options = options;
      } else {
        testingOutput.push({action: action, target: target, options: options});
      }
      sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
      return; // Prevent default keypress handling
    }
    // --- Chosen.js Handling --- END

    // Default handling for standard inputs
    var charCode = evt.keyCode || evt.which;
    var charStr = String.fromCharCode(charCode);
    if (!evt.target.labels || evt.target.labels.length === 0) { // Check if labels exist
      // Handle inputs without labels (e.g., use placeholder or name as fallback?)
      // For now, just return to avoid errors.
      // console.log("MagicTest: Keypress on element without labels, ignored.", evt.target);
      return;
    }
    var label = evt.target.labels[0].textContent;
    var text = (evt.target.value + charStr).trim().replace("'", "\\\'");
    var action = "fill_in";
    // Use label text or fall back to input name/id if label is empty
    var targetIdentifier = label || evt.target.name || evt.target.id;
    if (!targetIdentifier) return; // Cannot identify the input field

    var target = "\'" + targetIdentifier.trim().replace("'", "\\\'") + "\'";
    var options = ", with: '" + text + "'";
    var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
    var lastAction = testingOutput[testingOutput.length - 1];
    if (lastAction && lastAction.action == action && lastAction.target == target) {
      lastAction.options = options;
    } else {
      testingOutput.push({action: action, target: target, options: options});
    }
    sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
  }

  function keyDownFunction(evt){
    if (evt.target.labels) {
      return;
    }
    evt = evt || window.event;
    var charCode = evt.keyCode || evt.which;
    var charStr = capybaraFromCharCode(charCode);
    var letter = evt.key == "'" ? "\\\'" : evt.key;
    var tagName = evt.target.tagName.toLowerCase();

    // --- START: Use findBestSelector instead of finderForElement ---
    // var action = finderForElement(evt.target) + "."; // `find('${tagName}').`;
    var selector = findBestSelector(evt.target);
    var action;
    if (selector) {
       var escapedSelector = selector.replace(/'/g, "\\\\'"); // Escape for Ruby string
       action = `find('${escapedSelector}')`;
    } else {
       // Fallback if findBestSelector fails (e.g., use simple tag name, though potentially fragile)
       console.warn("MagicTest: Could not find suitable selector for keydown target, falling back to tag:", evt.target);
       action = `find('${tagName}')`; // Potentially fragile fallback
       // Alternatively: return; // Skip recording if selector fails
    }
    // --- END: Use findBestSelector ---

    var target = "";
    if (charStr) {
      target = `send_keys(${charStr})`;
    } else {
      target = `send_keys('${letter}')`;
    }
    var options = "";
    var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
    var lastAction = testingOutput[testingOutput.length - 1];
    // If the last key pressed was enter, always start a new action (otherwise with trix mentions, it happens too fast and we don't actually select the mentioned user correctly.)
    if (lastAction && lastAction.target.substr(lastAction.target.length - 7 , 6) == ":enter") {
      lastAction = null;
    }
    if (lastAction && lastAction.action == action && lastAction.target.substr(0,9) == 'send_keys') {
      if (charStr) {
        lastAction.target = lastAction.target.substr(0, lastAction.target.length - 1) + ', ' + charStr + ')'
      } else {
        if (lastAction.target.substr(lastAction.target.length - 2, 1) == "'") {
          lastAction.target = lastAction.target.substr(0, lastAction.target.length - 2) + letter + '\'' + ')'
        } else {
          lastAction.target = lastAction.target.substr(0, lastAction.target.length - 1) + ', \'' + letter + '\'' + ')'
        }
      }
    } else {
      testingOutput.push({action: action, target: target, options: options});
    }
    sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
  }

  function keyUpFunction(evt){
    if (evt.target.labels) {
      return;
    }

    evt = evt || window.event;
    var charCode = evt.keyCode || evt.which;
    var charStr = capybaraKeyUpFromCharCode(charCode);
    if (!charStr) {
      return;
    }
    var letter = String.fromCharCode(charCode);
    var tagName = evt.target.tagName.toLowerCase();
    var action = `find('${tagName}').`;
    var target = ""
    if (charStr) {
      target = `send_keys(${charStr})`;
    } else {
      target = `send_keys('${letter}')`;
    }
    var options = "";
    var testingOutput = JSON.parse(sessionStorage.getItem("testingOutput") || '[]');
    var lastAction = testingOutput[testingOutput.length - 1];
    if (lastAction && lastAction.action == action && lastAction.target.substr(0,9) == 'send_keys') {
      if (charStr) {
        lastAction.target = lastAction.target.substr(0, lastAction.target.length - 1) + ', ' + charStr + '' + ')'
      } else {
        lastAction.target = lastAction.target.substr(0, lastAction.target.length - 1) + ', \'' + letter + '\'' + ')'
      }
    } else {
      testingOutput.push({action: action, target: target, options: options});
    }
    sessionStorage.setItem("testingOutput", JSON.stringify(testingOutput));
  }

</script>
